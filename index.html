<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite umgezogen…</title>
<link rel="canonical" href="https://baadjid-portfolio.vercel.app/">
<meta name="robots" content="noindex, follow">
<style>
  /* ===== Design Tokens (aus tokens.css übernommen) ===== */
  :root {
    --primary:          #c9a87c;
    --primary-light:    #dfc9a8;
    --primary-dark:     #a68a5b;
    --primary-container: rgba(201, 168, 124, 0.15);
 
    --bg-primary:   #121212;
    --bg-card:      #211f1d;
    --bg-elevated:  #2a2725;
 
    --text-primary:   #f5f0eb;
    --text-secondary: #bdb5ab;
    --text-muted:     #8a847c;
    --text-on-primary: #1a1612;
 
    --border:       rgba(201, 168, 124, 0.12);
    --border-hover: rgba(201, 168, 124, 0.28);
    --shadow-lg:    0 16px 48px rgba(0,0,0,.55);
    --accent-glow:  rgba(201, 168, 124, 0.2);
 
    --t-fast:    150ms ease;
    --t-normal:  300ms cubic-bezier(0.4, 0, 0.2, 1);
  }
 
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
 
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
 
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow: hidden;
    position: relative;
  }
 
  /* Ambient Glow — leichtgewichtige Alternative zum vollen Canvas-Hintergrund */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(201, 168, 124, 0.10) 0%, transparent 45%),
      radial-gradient(circle at 75% 80%, rgba(141, 110, 76, 0.10) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }
 
  .card {
    position: relative;
    z-index: 1;
    max-width: 460px;
    width: 100%;
    background: rgba(33, 31, 29, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2.75rem 2.25rem;
    text-align: center;
    box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,0.03);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
 
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
 
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 1rem;
    background: var(--primary-container);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 1.5rem;
  }
 
  .spinner {
    width: 8px;
    height: 8px;
    border: 2px solid var(--primary-dark);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
 
  @keyframes spin { to { transform: rotate(360deg); } }
 
  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin-bottom: 0.75rem;
  }
 
  p {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 2rem;
  }
 
  .target-url {
    display: block;
    margin-top: 0.5rem;
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    word-break: break-all;
  }
 
  .btn-primary {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: var(--text-on-primary);
    padding: 0.875rem 1.875rem;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    transition: all var(--t-normal);
    box-shadow: 0 4px 20px var(--accent-glow);
    text-decoration: none;
  }
 
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px var(--accent-glow);
  }
 
  .btn-primary:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
 
  @media (prefers-reduced-motion: reduce) {
    .card, .spinner { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
 
  <main class="card">
    <span class="badge"><span class="spinner" aria-hidden="true"></span> Wird weitergeleitet</span>
    <h1>Diese Seite ist umgezogen</h1>
    <p>
      Du wirst gleich automatisch zur neuen Adresse gebracht.
      <span class="target-url" id="target-url">…</span>
    </p>
    <a class="btn-primary" id="target-link" href="#">Jetzt weiterleiten →</a>
  </main>
 
  <script>
    (function () {
      // ── Konfiguration ──────────────────────────────────────────
      var NEW_BASE = "https://baadjid-portfolio.vercel.app";
 
      // Name dieses Repos auf GitHub Pages, damit Unterpfade erkannt werden
      var REPO_BASE = "/educational-platform/";
 
      // ── Aktuellen Pfad/Hash auslesen ───────────────────────────
      var pathname = window.location.pathname;
      var extraPath = pathname.indexOf(REPO_BASE) === 0
        ? pathname.slice(REPO_BASE.length)
        : "";
 
      var hash = window.location.hash;     // z.B. "#/projekte/blender"
      var search = window.location.search; // z.B. "?ref=xyz"
 
      // ── Ziel-URL zusammensetzen ────────────────────────────────
      var target = NEW_BASE.replace(/\/$/, "");
      if (extraPath) {
        target += "/" + extraPath.replace(/^\/+/, "");
      }
      if (search) target += search;
      if (hash) target += hash;
 
      // ── Im UI anzeigen ──────────────────────────────────────────
      document.getElementById("target-link").href = target;
      document.getElementById("target-url").textContent = target;
 
      // ── Weiterleiten ─────────────────────────────────────────────
      setTimeout(function () {
        window.location.replace(target);
      }, 900);
    })();
  </script>
 
</body>
</html>
